<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0b1024"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo mark (rounded badge with 'id') -->
  <g transform="translate(80, 80)">
    <rect width="84" height="84" rx="20" fill="#0f172a" stroke="url(#accent)" stroke-width="2"/>
    <text x="42" y="58" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="42" font-weight="700" fill="url(#accent)">id</text>
  </g>

  <!-- Wordmark -->
  <text x="190" y="138" font-family="'Inter', -apple-system, system-ui, sans-serif" font-size="48" font-weight="600" fill="#f8fafc">nationid</text>

  <!-- npm version badge -->
  <g transform="translate(190, 156)">
    <rect width="86" height="26" rx="4" fill="#1e293b"/>
    <text x="14" y="18" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="14" font-weight="500" fill="#cbd5e1">npm</text>
    <rect x="46" width="40" height="26" rx="4" fill="#22c55e"/>
    <text x="66" y="18" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#0f172a">v1.1</text>
  </g>

  <!-- Headline -->
  <text x="80" y="290" font-family="'Fraunces', Georgia, serif" font-size="76" font-weight="500" fill="#f8fafc" letter-spacing="-1">Validate identity</text>
  <text x="80" y="370" font-family="'Fraunces', Georgia, serif" font-size="76" font-weight="500" fill="#f8fafc" letter-spacing="-1">documents from</text>
  <text x="80" y="450" font-family="'Fraunces', Georgia, serif" font-size="76" font-weight="500" fill="url(#accent)" letter-spacing="-1">34 countries.</text>

  <!-- Subline -->
  <text x="80" y="510" font-family="'Inter', -apple-system, system-ui, sans-serif" font-size="26" font-weight="400" fill="#94a3b8">TypeScript-first · cited confidence · tree-shakable · zero deps</text>

  <!-- Country flag row -->
  <g font-family="-apple-system, 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif" font-size="38">
    <text x="80" y="580">🇸🇻 🇲🇽 🇨🇴 🇧🇷 🇵🇪 🇦🇷 🇨🇱 🇪🇸 🇺🇸 🇬🇧 🇫🇷 🇩🇪 🇮🇹 🇳🇱 🇵🇱 🇸🇪 🇳🇴 🇩🇰 🇫🇮 🇨🇦 🇵🇹</text>
  </g>

  <!-- Bottom-right URL -->
  <text x="1120" y="592" text-anchor="end" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="18" font-weight="500" fill="#64748b">github.com/lu1tr0n/nationid</text>
</svg>
